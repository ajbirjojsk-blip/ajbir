<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--y:#FFC60A;--ink:#000;--bg:#fff;--card:#f6f6f2;--mut:#5c5c55;--line:#e4e4dc;--ok:#1a7f37;--bad:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#fff;--bg:#000;--card:#1a1a17;--mut:#a8a8a0;--line:#333}}
:root[data-theme="dark"]{--ink:#fff;--bg:#000;--card:#1a1a17;--mut:#a8a8a0;--line:#333}
html{scroll-padding-top:env(safe-area-inset-top,0px);overflow-x:hidden}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Hind Siliguri',system-ui,sans-serif;padding-bottom:64px;overflow-x:hidden}
h1,h2,h3,.logo{font-family:'Bricolage Grotesque','Hind Siliguri',sans-serif;line-height:1.15;margin:0}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--y);z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--y);z-index:20;padding:8px 8px;color:#000;width:100%}
.row{display:flex;align-items:center;gap:6px;width:100%}.sp{flex:1}
.logo{font-size:22px;font-weight:800;text-decoration:none;letter-spacing:-.5px;flex-shrink:0}
.pill{border:2px solid #000;background:transparent;color:#000;border-radius:99px;padding:3px 8px;cursor:pointer;font-weight:600;white-space:nowrap;font-size:13px;flex-shrink:1;overflow:hidden;text-overflow:ellipsis}
.search{width:100%;margin-top:6px;padding:8px 12px;border-radius:12px;border:2px solid #000;background:#fff;color:#000}
main{max-width:1100px;margin:0 auto;padding:12px;overflow-x:hidden}
.hero{background:linear-gradient(115deg,#080808 0%,#17130a 58%,#302000 100%);color:#fff;border-radius:20px;padding:24px;margin:4px 0 16px;position:relative;overflow:hidden;isolation:isolate;min-height:220px;box-shadow:0 12px 30px #0002}
.hero:before{content:'';position:absolute;inset:-50% auto -50% -35%;width:45%;background:linear-gradient(90deg,transparent,#ffffff16,transparent);transform:rotate(22deg);animation:heroShine 6s ease-in-out infinite;z-index:-1}
.hero h1{font-size:clamp(26px,6vw,44px);font-weight:800;max-width:680px;position:relative;z-index:2}.hero h1 b{color:var(--y)}
.hero p{color:#ddd;margin:8px 0 16px;max-width:620px;position:relative;z-index:2}
.hero .btn{position:relative;z-index:3;box-shadow:0 5px 0 #9a7100;transition:transform .2s,box-shadow .2s}.hero .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #9a7100}
.hero-scene{position:absolute;right:16px;bottom:8px;width:min(42%,310px);height:145px;pointer-events:none;z-index:1}
.hero-scene .sun-glow{position:absolute;width:115px;height:115px;border-radius:50%;right:24px;top:0;background:#ffc60a18;filter:blur(3px);animation:glowPulse 3s ease-in-out infinite}
.hero-scene .route-line{position:absolute;right:0;bottom:20px;width:100%;height:3px;border-radius:5px;background:repeating-linear-gradient(90deg,#ffc60a 0 12px,transparent 12px 22px);animation:routeMove 1s linear infinite}
.hero-scene .delivery-scooter{position:absolute;right:12px;bottom:19px;font-size:clamp(48px,8vw,72px);filter:drop-shadow(0 8px 5px #0008);animation:scooterRide 3.8s ease-in-out infinite}
.hero-scene .delivery-box{position:absolute;right:85px;bottom:75px;font-size:35px;filter:drop-shadow(0 5px 3px #0008);animation:boxFloat 2s ease-in-out infinite}
.hero-scene .speed{position:absolute;right:120px;bottom:34px;color:#ffc60a;font-size:20px;letter-spacing:3px;animation:speedFlash .7s steps(2,end) infinite}
.hero-scene .scene-label{position:absolute;right:8px;top:6px;color:#ffe18a;font-size:10px;letter-spacing:1.4px;font-weight:700;text-transform:uppercase}
@keyframes heroShine{0%,65%{left:-45%;opacity:0}75%{opacity:1}100%{left:130%;opacity:0}}
@keyframes routeMove{to{background-position:22px 0}}
@keyframes scooterRide{0%,10%{transform:translateX(28px) translateY(0) rotate(-2deg)}45%{transform:translateX(-12px) translateY(-5px) rotate(1deg)}70%,100%{transform:translateX(28px) translateY(0) rotate(-2deg)}}
@keyframes boxFloat{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-10px) rotate(5deg)}}
@keyframes speedFlash{0%,100%{opacity:.2;transform:translateX(5px)}50%{opacity:1;transform:translateX(-4px)}}
@keyframes glowPulse{0%,100%{transform:scale(.85);opacity:.5}50%{transform:scale(1.15);opacity:1}}
.btn{background:var(--y);color:#000;border:2px solid #000;border-radius:12px;padding:12px 18px;font-weight:600;cursor:pointer;width:100%;text-align:center}
.btn.dark{background:#000;color:#fff;border-color:#000}.btn.sm{padding:6px 12px;width:auto}.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad)}.btn:disabled{opacity:.5}
.hero .btn{border-color:var(--y);width:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}
.chip{flex:none;border:2px solid var(--ink);border-radius:99px;padding:4px 14px;background:transparent;cursor:pointer;max-width:100%;white-space:normal;text-align:center;word-break:break-word}.chip.on{background:var(--y);color:#000;border-color:#000}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.cat{background:var(--card);border-radius:16px;padding:12px 4px;text-align:center;cursor:pointer;border:0;font-weight:500}.cat span{display:block;font-size:34px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}
.pc{border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:2px;position:relative}
.pc .im{background:var(--card);border-radius:12px;font-size:56px;text-align:center;padding:10px;cursor:pointer;overflow:hidden;height:80px;display:flex;align-items:center;justify-content:center}
.pc .off{position:absolute;top:6px;left:6px;background:var(--y);color:#000;border-radius:8px;padding:0 6px;font-size:12px;font-weight:600}
.pc .w{position:absolute;top:6px;right:6px;background:none;border:0;font-size:20px;cursor:pointer}
.pr{font-weight:600}.pr s{color:var(--mut);font-weight:400;margin-left:6px;font-size:14px}.mut{color:var(--mut);font-size:14px}
.qty{display:inline-flex;align-items:center;border:2px solid #000;border-radius:10px;background:var(--y);color:#000;overflow:hidden}.qty button{border:0;background:none;padding:2px 12px;cursor:pointer;font-weight:800}
h2{font-size:22px;margin:20px 0 10px}
.box{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}.f input,.f select,.f textarea{padding:10px;border:2px solid var(--line);border-radius:10px;background:var(--bg)}
.err{color:var(--bad);font-size:14px}.ok{color:var(--ok)}
.demo{background:var(--y);color:#000;padding:6px 12px;font-size:13px;text-align:center}
nav.bt{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.bt a{flex:1;text-align:center;padding:8px 0;text-decoration:none;font-size:12px}nav.bt a span{display:block;font-size:20px}
.tl{display:flex;gap:4px;margin:12px 0}.tl div{flex:1;height:6px;border-radius:3px;background:var(--line)}.tl .d{background:var(--y)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left}
footer{max-width:1100px;margin:24px auto;padding:12px;color:var(--mut);font-size:14px}footer a{margin-right:12px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#000;color:#fff;padding:8px 16px;border-radius:12px;z-index:40;white-space:nowrap}
@media(max-width:520px){.hero{padding:20px 18px 112px;min-height:270px}.hero-scene{width:62%;height:112px;right:8px;bottom:0}.hero-scene .delivery-scooter{font-size:54px}.hero-scene .delivery-box{right:66px;bottom:62px;font-size:28px}.hero-scene .scene-label{font-size:9px}}
@media(min-width:760px){nav.bt{display:none}body{padding-bottom:0}}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.admin-tab-btn{background:var(--card);border:1px solid var(--line);padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600}
.customer-storage-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}
.customer-storage-card{min-width:0;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg)}
.customer-storage-meta{display:grid;gap:8px;margin-top:12px}
.customer-storage-meta>div{display:flex;flex-direction:column;gap:2px;padding-top:8px;border-top:1px solid var(--line);min-width:0}
.customer-storage-meta small{color:var(--mut);font-size:12px}
.customer-storage-meta b{font-size:13px;overflow-wrap:anywhere}

.admin-tab-btn.active{background:var(--y);color:#000;border-color:#000}

/* Trusted delivery completion experience */
.delivery-success{position:relative;overflow:hidden;text-align:center;padding:24px 16px;border:1px solid #b7e4c7;background:linear-gradient(145deg,#f1fff5,#ffffff 65%);border-radius:18px;margin:12px 0 16px;color:#174b2b}
.delivery-success:before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:#35b86b12;left:50%;top:-105px;transform:translateX(-50%)}
.delivery-check{position:relative;width:76px;height:76px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#24b765,#138a49);color:#fff;font-size:42px;box-shadow:0 8px 22px #168b4b35;animation:deliveryPop .65s cubic-bezier(.2,.8,.2,1) both}
.delivery-check:after{content:"";position:absolute;inset:-7px;border:2px solid #29ad61;border-radius:50%;animation:deliveryRipple 1.6s ease-out infinite}
.delivery-success h3{margin:4px 0 5px;color:#146c39;font-size:20px}
.delivery-success p{margin:4px 0;color:#47765a;font-size:13px}
.delivery-trust{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:13px}
.delivery-trust span{background:#fff;border:1px solid #d6efdf;border-radius:999px;padding:6px 10px;font-size:11px;color:#286342}
.delivery-timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:15px 0 5px;text-align:center}
.delivery-timeline .dt-step{font-size:11px;color:var(--muted,#777);position:relative}
.delivery-timeline .dt-icon{width:34px;height:34px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;background:#e8f6ed;color:#168a49;font-size:17px;border:1px solid #cce8d5}
.delivery-timeline .dt-step.done .dt-icon{background:#168a49;color:#fff;border-color:#168a49}
.delivery-timeline .dt-step strong{display:block;font-size:10px;font-weight:600}
@keyframes deliveryPop{0%{opacity:0;transform:scale(.45) rotate(-18deg)}70%{transform:scale(1.12) rotate(5deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes deliveryRipple{0%{transform:scale(.82);opacity:.8}100%{transform:scale(1.35);opacity:0}}
@media(prefers-reduced-motion:reduce){.delivery-check,.delivery-check:after{animation:none!important}}

/* AJBIR brand identity + 3D opening splash */
.brand-mark{width:42px;height:42px;object-fit:cover;border-radius:50%;display:block;flex:0 0 42px;box-shadow:0 2px 8px #0003}
.brand-home{display:flex;align-items:center;gap:8px;text-decoration:none;flex-shrink:0}
.brand-home .brand-word{font:800 20px/1 'Bricolage Grotesque',sans-serif;letter-spacing:-.7px;color:#111}
#ajbir-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(circle at 50% 42%,#292929 0%,#111 42%,#050505 100%);perspective:1100px;animation:splashFade .65s ease 2.15s forwards}
#ajbir-splash .splash-logo{width:min(68vw,290px);height:auto;aspect-ratio:1;object-fit:cover;border-radius:50%;box-shadow:0 25px 65px #ffb90055,0 0 0 2px #ffc60a;transform-style:preserve-3d;animation:ajbir3D 2.15s cubic-bezier(.2,.75,.2,1) both}
#ajbir-splash .splash-name{font:800 clamp(28px,8vw,42px)/1 'Bricolage Grotesque',sans-serif;letter-spacing:5px;color:#fff;text-shadow:0 3px 0 #9b6500,0 8px 22px #ffb90088;animation:nameRise 1s ease .35s both}
#ajbir-splash .splash-tag{font:500 12px/1.4 'Hind Siliguri',sans-serif;letter-spacing:2.5px;color:#ffd65a;text-transform:uppercase;animation:nameRise 1s ease .55s both}
.splash-delivery{display:flex;align-items:center;gap:10px;color:#fff;background:#ffffff10;border:1px solid #ffffff25;border-radius:999px;padding:8px 15px;font:600 12px 'Hind Siliguri',sans-serif;animation:nameRise .8s ease .8s both}
.splash-delivery .step{display:flex;align-items:center;gap:5px;white-space:nowrap}
.splash-delivery .arrow{color:#ffc60a;animation:arrowPulse .8s ease-in-out infinite alternate}
.splash-delivery .ride{display:inline-block;animation:miniRide 1.6s ease-in-out infinite}
@keyframes arrowPulse{to{transform:translateX(3px);opacity:.55}}
@keyframes miniRide{0%,100%{transform:translateX(0) rotate(0)}50%{transform:translateX(5px) rotate(-7deg)}}
@keyframes ajbir3D{0%{opacity:0;transform:rotateY(-95deg) rotateX(35deg) scale(.55) translateY(35px)}55%{opacity:1;transform:rotateY(18deg) rotateX(-8deg) scale(1.06) translateY(-5px)}78%{transform:rotateY(-7deg) rotateX(3deg) scale(.98)}100%{opacity:1;transform:rotateY(0) rotateX(0) scale(1)}}
@keyframes nameRise{from{opacity:0;transform:translateY(16px) translateZ(-35px)}to{opacity:1;transform:translateY(0) translateZ(0)}}
@keyframes splashFade{to{opacity:0;visibility:hidden;pointer-events:none}}
@media(prefers-reduced-motion:reduce){#ajbir-splash{animation:splashFade .2s ease .5s forwards}#ajbir-splash .splash-logo,#ajbir-splash .splash-name,#ajbir-splash .splash-tag,.splash-delivery *,.hero-scene *,.hero:before{animation:none!important}.hero-scene .delivery-scooter{transform:none}}


/* Bengali voice customer-support assistant */
.ai-support{border:1px solid #d8e9dd;background:linear-gradient(145deg,#f4fff7,#fff);border-radius:18px;padding:15px;margin:14px 0;color:#173d29}
.ai-head{display:flex;align-items:center;gap:11px;margin-bottom:12px}.ai-avatar{width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,#16a34a,#08743a);display:grid;place-items:center;color:#fff;font-size:24px;box-shadow:0 6px 16px #168b4930}
.ai-status{font-size:11px;color:#16834a}.ai-chat{height:210px;overflow:auto;background:#fff;border:1px solid #e3eee6;border-radius:13px;padding:10px;margin:10px 0;display:flex;flex-direction:column;gap:9px}
.ai-msg{max-width:88%;padding:9px 11px;border-radius:13px;font-size:13px;line-height:1.5;white-space:pre-wrap}.ai-msg.bot{background:#eff8f1;align-self:flex-start;border-bottom-left-radius:4px}.ai-msg.user{background:#168b49;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.ai-controls{display:flex;gap:8px;align-items:center}.ai-controls input{min-width:0;flex:1}.ai-mic{background:#fff;border:1px solid #168b49;color:#168b49;border-radius:12px;padding:10px 12px;font-size:18px}.ai-mic.listening{background:#fee2e2;border-color:#dc2626;color:#dc2626;animation:aiPulse 1s infinite}
.ai-note{font-size:11px;color:#668071;margin:9px 1px 0}.ai-quick{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.ai-quick button{border:1px solid #cde6d4;background:#fff;color:#21623b;border-radius:999px;padding:7px 10px;font-size:11px}
@keyframes aiPulse{50%{box-shadow:0 0 0 6px #dc262622}}
@media(prefers-reduced-motion:reduce){.ai-mic.listening{animation:none}}


/* ===== AJBIR motion layer (professional animations everywhere) ===== */
:root{--ease:cubic-bezier(.2,.8,.2,1)}
@keyframes mFadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes mPop{from{opacity:0;transform:scale(.92) translateY(12px)}to{opacity:1;transform:none}}
@keyframes mSlideIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes mDown{from{transform:translateY(-100%)}to{transform:none}}
@keyframes mUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes mBump{0%{transform:scale(1)}35%{transform:scale(1.28) rotate(-3deg)}70%{transform:scale(.96)}100%{transform:scale(1)}}
@keyframes mToast{from{opacity:0;transform:translate(-50%,18px) scale(.94)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes mMsgL{from{opacity:0;transform:translateX(-14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes mMsgR{from{opacity:0;transform:translateX(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes mFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes mGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes mRipple{to{transform:scale(2.6);opacity:0}}
@keyframes mGlow{0%,100%{box-shadow:0 0 0 0 #ffc60a00}50%{box-shadow:0 0 0 5px #ffc60a55}}
.m-rip{position:absolute;border-radius:50%;background:currentColor;opacity:.22;transform:scale(0);pointer-events:none;animation:mRipple .6s ease-out forwards}
.btn,.pill,.chip,.cat,.dept,.ai-mic,.ai-quick button,.admin-tab-btn{position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
@media(prefers-reduced-motion:no-preference){
header{animation:mDown .6s var(--ease) 2.1s backwards}
nav.bt{animation:mUp .6s var(--ease) 2.2s backwards}
footer{animation:mFadeUp .6s ease 2.3s backwards}
/* page entrance (runs on every page change) */
#app.pg-anim>*{animation:mFadeUp .55s var(--ease) backwards}
#app.pg-anim>:nth-child(2){animation-delay:.07s}#app.pg-anim>:nth-child(3){animation-delay:.14s}
#app.pg-anim>:nth-child(4){animation-delay:.21s}#app.pg-anim>:nth-child(5){animation-delay:.28s}
#app.pg-anim>:nth-child(n+6){animation-delay:.35s}
#app.pg-anim .grid>*,#app.pg-anim .cats>*{animation:mPop .5s var(--ease) backwards}
#app.pg-anim .chips>*{animation:mSlideIn .45s var(--ease) backwards}
#app.pg-anim .box,#app.pg-anim .ai-support,#app.pg-anim .delivery-success{animation:mFadeUp .55s var(--ease) backwards}
#app.pg-anim tbody tr{animation:mFadeUp .4s var(--ease) backwards}
#app.pg-anim .tl .d{transform-origin:left;animation:mGrow .6s var(--ease) .3s backwards}
#app.pg-anim .dt-step{animation:mPop .5s var(--ease) backwards}
#app.pg-anim .dt-step:nth-child(2){animation-delay:.12s}#app.pg-anim .dt-step:nth-child(3){animation-delay:.24s}#app.pg-anim .dt-step:nth-child(4){animation-delay:.36s}
#app.pg-anim .grid>:nth-child(1),#app.pg-anim .cats>:nth-child(1),#app.pg-anim .chips>:nth-child(1),#app.pg-anim tbody tr:nth-child(1){animation-delay:.05s}
#app.pg-anim .grid>:nth-child(2),#app.pg-anim .cats>:nth-child(2),#app.pg-anim .chips>:nth-child(2),#app.pg-anim tbody tr:nth-child(2){animation-delay:.1s}
#app.pg-anim .grid>:nth-child(3),#app.pg-anim .cats>:nth-child(3),#app.pg-anim .chips>:nth-child(3),#app.pg-anim tbody tr:nth-child(3){animation-delay:.15s}
#app.pg-anim .grid>:nth-child(4),#app.pg-anim .cats>:nth-child(4),#app.pg-anim .chips>:nth-child(4),#app.pg-anim tbody tr:nth-child(4){animation-delay:.2s}
#app.pg-anim .grid>:nth-child(5),#app.pg-anim .cats>:nth-child(5),#app.pg-anim .chips>:nth-child(5),#app.pg-anim tbody tr:nth-child(5){animation-delay:.25s}
#app.pg-anim .grid>:nth-child(6),#app.pg-anim .cats>:nth-child(6),#app.pg-anim .chips>:nth-child(6),#app.pg-anim tbody tr:nth-child(6){animation-delay:.3s}
#app.pg-anim .grid>:nth-child(7),#app.pg-anim .cats>:nth-child(7),#app.pg-anim .chips>:nth-child(7),#app.pg-anim tbody tr:nth-child(7){animation-delay:.35s}
#app.pg-anim .grid>:nth-child(8),#app.pg-anim .cats>:nth-child(8),#app.pg-anim .chips>:nth-child(8),#app.pg-anim tbody tr:nth-child(8){animation-delay:.4s}
#app.pg-anim .grid>:nth-child(n+9),#app.pg-anim .cats>:nth-child(n+9),#app.pg-anim .chips>:nth-child(n+9),#app.pg-anim tbody tr:nth-child(n+9){animation-delay:.45s}
/* feedback & micro-interactions */
.btn,.pill,.chip,.cat,.qty,.qty button,.ai-mic,.ai-quick button,.admin-tab-btn,.pc .w{transition:transform .2s var(--ease),box-shadow .25s,background-color .25s,border-color .25s,color .25s}
.btn:active,.pill:active,.chip:active,.cat:active,.ai-mic:active,.ai-quick button:active,.admin-tab-btn:active{transform:scale(.95)}
.qty button:active{transform:scale(.8)}.pc .w:active{transform:scale(1.4) rotate(-8deg)}
.pc{transition:transform .3s var(--ease),box-shadow .3s,border-color .3s}
.pc .im{transition:transform .4s var(--ease),background-color .3s}
.box{transition:box-shadow .3s,border-color .3s,transform .3s var(--ease)}
.search{transition:box-shadow .25s,transform .25s var(--ease)}.search:focus{outline:none;box-shadow:0 0 0 4px #00000030;transform:scale(1.015)}
.f input,.f select,.f textarea,.ai-controls input{transition:border-color .25s,box-shadow .25s}
.f input:focus,.f select:focus,.f textarea:focus,.ai-controls input:focus{outline:none;border-color:var(--y);box-shadow:0 0 0 3px #ffc60a55}
nav.bt a{transition:transform .2s var(--ease),color .2s}nav.bt a span{transition:transform .3s var(--ease)}
nav.bt a:active span{transform:translateY(-4px) scale(1.25)}
footer a{transition:color .2s,opacity .2s}
.pill.bump{animation:mBump .5s var(--ease)}
.toast{animation:mToast .35s var(--ease)}
.ai-msg.bot{animation:mMsgL .35s var(--ease)}.ai-msg.user{animation:mMsgR .35s var(--ease)}
.ai-avatar{animation:mFloat 3.2s ease-in-out infinite}
.chip.on{animation:mGlow 2.4s ease-in-out infinite}
.demo{animation:mFadeUp .5s var(--ease) both}
@media(hover:hover){
.pc:hover{transform:translateY(-5px);box-shadow:0 14px 28px #0000001c;border-color:var(--y)}
.pc:hover .im{transform:scale(1.07) rotate(-2deg)}
.cat:hover{transform:translateY(-4px);box-shadow:0 10px 22px #00000018}.cat span{transition:transform .3s var(--ease)}.cat:hover span{transform:scale(1.18) rotate(-5deg)}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 18px #00000028}
.pill:hover{background:#00000014;transform:translateY(-1px)}
.chip:hover:not(.on){background:var(--y);color:#000;transform:translateY(-2px)}
.box:hover{box-shadow:0 8px 22px #00000012}
.ai-quick button:hover,.ai-mic:hover,.admin-tab-btn:hover{transform:translateY(-2px);box-shadow:0 6px 14px #0000001a}
nav.bt a:hover span{transform:translateY(-2px)}
footer a:hover{color:var(--ink)}
tbody tr{transition:background-color .2s}tbody tr:hover{background:var(--card)}
}
}

/* ===== Departments: Grocery / Medicine / Hardware / Cleaning ===== */
.depts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 2px}
.dept{border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:16px;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1.2;min-width:0;transition:transform .25s var(--ease),box-shadow .25s,background-color .25s}
.dept span{font-size:28px;transition:transform .3s var(--ease)}.dept b{font-size:13px;font-weight:600;text-align:center;overflow-wrap:anywhere}
.dept.on{background:var(--y);color:#000;border-color:#000;box-shadow:0 5px 0 #9a7100;transform:translateY(-2px)}.dept.on span{transform:scale(1.15)}
.dept:active{transform:scale(.95)}
@media(max-width:380px){.dept b{font-size:11px}.dept span{font-size:24px}}
@media(prefers-reduced-motion:no-preference){
.deptpanel.swap h2,.deptpanel.swap .cats>*,.deptpanel.swap .grid>*{animation:mPop .45s var(--ease) backwards}
.deptpanel.swap .cats>:nth-child(2),.deptpanel.swap .grid>:nth-child(2){animation-delay:.05s}
.deptpanel.swap .cats>:nth-child(3),.deptpanel.swap .grid>:nth-child(3){animation-delay:.1s}
.deptpanel.swap .cats>:nth-child(4),.deptpanel.swap .grid>:nth-child(4){animation-delay:.15s}
.deptpanel.swap .grid>:nth-child(n+5){animation-delay:.2s}
}

/* Mobile-friendly admin order cards */
.admin-order-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px;width:100%;min-width:0}
.admin-order-card{box-sizing:border-box;width:100%;min-width:0;border:1px solid var(--line);border-radius:13px;padding:13px;background:var(--bg);overflow:hidden}
.admin-order-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.admin-order-id{overflow-wrap:anywhere}
.admin-order-total{white-space:nowrap;font-size:19px}
.admin-order-customer{display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:10px}
.admin-order-customer span,.admin-order-summary{color:var(--mut)}
.admin-order-summary{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:8px;font-size:13px}
.admin-order-details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}

.admin-order-actions select{flex:1;min-width:150px;max-width:100%;box-sizing:border-box;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}

.admin-customer-search{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}

function ajbirChatKey(){
  if(S.user && S.user.id) return 'user:'+String(S.user.id);
  let guest=localStorage.getItem('ajbir_guest_chat_id');
  if(!guest){guest='guest-'+Math.random().toString(36).slice(2,10);localStorage.setItem('ajbir_guest_chat_id',guest)}
  return guest;
}
function ajbirSaveChat(message,who){
  try{
    const key=ajbirChatKey(); const all=JSON.parse(localStorage.getItem('ajbir_support_chats')||'{}');
    if(!all[key]) all[key]={key,customer:(S.user&&(S.user.name||S.user.mobile))||'Guest customer',mobile:(S.user&&S.user.mobile)||'',messages:[],updatedAt:Date.now()};
    all[key].messages.push({who,message:String(message),at:Date.now()}); all[key].updatedAt=Date.now();
    localStorage.setItem('ajbir_support_chats',JSON.stringify(all));
  }catch(e){console.warn('Chat could not be saved',e)}
}
function ajbirLoadChat(){
  const chat=document.getElementById('aiChat');if(!chat)return;
  try{const all=JSON.parse(localStorage.getItem('ajbir_support_chats')||'{}');const item=all[ajbirChatKey()];
    if(item&&item.messages&&item.messages.length){chat.innerHTML='';item.messages.forEach(m=>ajbirAddMessage(m.message,m.who,false));return;}
  }catch(e){}
}
function ajbirAddMessage(message,who,save=true){
  const chat=document.getElementById('aiChat'); if(!chat)return;
  const el=document.createElement('div'); el.className='ai-msg '+(who==='user'?'user':'bot'); el.textContent=message;
  chat.appendChild(el); chat.scrollTop=chat.scrollHeight;
  if(save) ajbirSaveChat(message,who);
}
function ajbirRenderChatInbox(){
  const box=document.getElementById('admin-chat-inbox');if(!box)return;
  let all={};try{all=JSON.parse(localStorage.getItem('ajbir_support_chats')||'{}')}catch(e){}
  const chats=Object.values(all).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  if(!chats.length){box.innerHTML='<p class="mut">এখনও কোনো কাস্টমার মেসেজ আসেনি।</p>';return;}
  box.innerHTML=chats.map((c,i)=>`<div class="box"><div class="row"><b>👤 ${String(c.customer||'Customer').replace(/[<>]/g,'')}</b><small class="mut">${new Date(c.updatedAt||Date.now()).toLocaleString('bn-IN')}</small></div><small class="mut">${String(c.mobile||'Guest').replace(/[<>]/g,'')}</small><div style="margin-top:9px;max-height:190px;overflow:auto">${(c.messages||[]).map(m=>`<p style="margin:6px 0;padding:8px;border-radius:9px;background:${m.who==='user'?'#e8f5e9':'#f3f4f6'}"><b>${m.who==='user'?'কাস্টমার':'AJBIR AI'}:</b> ${String(m.message||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}</p>`).join('')}</div></div>`).join('');
}
function ajbirReply(question){
  const q=String(question||'').toLowerCase();
  if(/অর্ডার|order|কোথায়|কোথায়|স্ট্যাটাস|status/.test(q)){
    const orders=Array.isArray(S.orders)?S.orders:[];
    const mine=S.user?orders.filter(o=>o.user_id===S.user.id):[];
    if(mine.length){const o=mine[mine.length-1];return `আপনার সাম্প্রতিক অর্ডার ${o.id||''}-এর বর্তমান স্ট্যাটাস: ${o.status||'আপডেট পাওয়া যায়নি'}। বিস্তারিত দেখতে Orders অপশনে যান।`;}
    return 'আপনার অর্ডারের বিস্তারিত দেখতে অ্যাপের Orders অপশনে যান। অর্ডার করার সময় যে অ্যাকাউন্ট ব্যবহার করেছেন, সেই অ্যাকাউন্টে লগ ইন করুন।';
  }
  if(/ডেলিভারি|delivery|কতক্ষণ|সময়|সময়|কখন/.test(q)) return 'সার্ভিসযোগ্য এলাকায় সাধারণত প্রায় ৩০ মিনিটের মধ্যে ডেলিভারির লক্ষ্য রাখা হয়। আপনার অর্ডারের নির্দিষ্ট আপডেট Orders অপশনে দেখতে পারবেন।';
  if(/রিফান্ড|refund|টাকা ফেরত/.test(q)) return 'প্রিপেইড অর্ডারের রিফান্ড সাধারণত মূল পেমেন্ট পদ্ধতিতে ৫ থেকে ৭ কর্মদিবসের মধ্যে ফেরত দেওয়া হয়। অর্ডার আইডি দিয়ে Help Center-এ অনুরোধ পাঠাতে পারেন।';
  if(/বাতিল|cancel/.test(q)) return 'অর্ডার Out for delivery হওয়ার আগে Orders অপশন থেকে cancellation request পাঠাতে পারেন।';
  if(/পেমেন্ট|payment|upi|টাকা/.test(q)) return 'পেমেন্ট সংক্রান্ত সমস্যায় অর্ডার আইডি উল্লেখ করে Help Center-এর Raise a request ফর্ম পাঠান। কখনোই UPI PIN বা OTP কাউকে দেবেন না।';
  if(/মানুষ|কর্মী|এজেন্ট|human|agent|কথা বলতে চাই/.test(q)) return 'আপনি Help Center-এর Raise a request ফর্মে বিস্তারিত লিখে পাঠাতে পারেন। টিম আপনার অনুরোধ পর্যালোচনা করবে।';
  if(/হ্যালো|নমস্কার|hello|hi|সালাম/.test(q)) return 'নমস্কার! AJBIR-এ আপনাকে স্বাগতম। অর্ডার, ডেলিভারি, পেমেন্ট বা রিফান্ড—কোন বিষয়ে সাহায্য চাইছেন?';
  return 'দুঃখিত, বিষয়টি পুরোপুরি বুঝতে পারিনি। অর্ডার, ডেলিভারি, পেমেন্ট বা রিফান্ড সম্পর্কে একটু নির্দিষ্ট করে বলবেন?';
}
function ajbirSpeak(message){
  if(!('speechSynthesis' in window))return;
  window.speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(message); u.lang='bn-IN'; u.rate=.96; window.speechSynthesis.speak(u);
}
function ajbirQuick(q){const input=document.getElementById('aiInput');if(input)input.value=q;ajbirAsk();}
function ajbirAsk(){
  const input=document.getElementById('aiInput');if(!input)return;const q=input.value.trim();if(!q)return;
  ajbirAddMessage(q,'user');input.value='';const answer=ajbirReply(q);
  setTimeout(()=>{ajbirAddMessage(answer,'bot');ajbirSpeak(answer);},350);
}
function ajbirVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const btn=document.getElementById('aiMic');
  if(!SR){ajbirAddMessage('আপনার ব্রাউজারে বাংলা voice input সমর্থিত নয়। দয়া করে প্রশ্নটি লিখে পাঠান।','bot');return;}
  const rec=new SR();rec.lang='bn-IN';rec.interimResults=false;rec.maxAlternatives=1;
  if(btn)btn.classList.add('listening');if(btn)btn.textContent='⏺️';
  rec.onresult=e=>{const t=e.results?.[0]?.[0]?.transcript||'';const input=document.getElementById('aiInput');if(input){input.value=t;ajbirAsk();}};
  rec.onerror=()=>ajbirAddMessage('ভয়েস শোনা যায়নি। মাইক্রোফোনের অনুমতি পরীক্ষা করে আবার চেষ্টা করুন।','bot');
  rec.onend=()=>{if(btn){btn.classList.remove('listening');btn.textContent='🎙️';}};
  try{rec.start();}catch(e){if(btn){btn.classList.remove('listening');btn.textContent='🎙️';}}
}

function paintHead(){
  const n=Object.values(S.cart).reduce((a,b)=>a+b,0);
  let displayArea = S.areaName || 'Amtala';
  const cartBtn = $('#cartb');
  const locBtn = $('#loc');
  const langBtn = $('#lang');
  const qInput = $('#q');
  
  if(cartBtn) cartBtn.textContent = '🛒 ' + n;
  if(locBtn) locBtn.textContent = '📍 ' + displayArea;
  if(langBtn) langBtn.textContent = S.lang == 'bn' ? 'English' : 'বাংলা';
  if(qInput) qInput.placeholder = L('Search rice, milk, eggs…');

  const bnav = $('#bnav');

    if(!bnav.querySelector('a[href="#admin"]')){
      bnav.insertAdjacentHTML('beforeend', `<a href="#admin"><span>⚡</span>Admin</a>`);
    }
  }
}

const disc=p=>Math.round((1-p.p/p.mrp)*100);
function card(p){
  const q=S.cart[p.id]||0,w=S.wish.includes(p.id);
  const mediaContent = p.img ? `<img src="${p.img}" style="width:100%;height:100%;object-fit:contain">` : p.e;
  return `<div class="pc"><span class="off">${disc(p)}% off</span><button class="w" onclick="wish(${p.id})" aria-label="Wishlist">${w?'♥':'♡'}</button><div class="im" onclick="location.hash='p'+${p.id}">${mediaContent}</div><div>${pn(p)}</div><div class="mut">${p.u}</div><div class="pr">${rs(p.p)}<s>${rs(p.mrp)}</s></div>${p.stock?(q?`<span class="qty"><button onclick="setq(${p.id},-1)">−</button>${q}<button onclick="setq(${p.id},1)">+</button></span>`:`<button class="btn sm" onclick="setq(${p.id},1)">${L('Add')}</button>`):'<span class="mut">Out of stock</span>'}</div>`;
}
function setq(id,d){const p=P.find(x=>x.id==id);const n=(S.cart[id]||0)+d;if(n>p.stock){toast('Only '+p.stock+' in stock');return}if(n<=0)delete S.cart[id];else S.cart[id]=n;save();route()}
function wish(id){S.wish=S.wish.includes(id)?S.wish.filter(x=>x!=id):[...S.wish,id];save();route()}
function totals(code){let sub=0,mrp=0;for(const id in S.cart){const p=P.find(x=>x.id==id);if(p){sub+=p.p*S.cart[id];mrp+=p.mrp*S.cart[id]}}let cd=0;const c=COUPONS[code];if(c&&sub>=c.min)cd=c.off||Math.min(sub*c.pct/100,c.max);const fee=sub&&sub-cd<CFG.free?CFG.fee:0;return{sub,mrp,save:mrp-sub,cd,fee,tax:0,total:Math.max(0,sub-cd+fee)}}

helpcenter(){return `<section style="padding:8px 0 16px"><div class="box" style="background:linear-gradient(135deg,#fff8d9,#fff);border-color:#f3d46b;text-align:center;padding:22px 16px"><div style="font-size:42px">🎧</div><h2 style="margin:8px 0">AJBIR Help Center</h2><p>আপনার কেনাকাটার যেকোনো সমস্যায় আমরা পাশে আছি। অর্ডার, ডেলিভারি, পেমেন্ট বা রিফান্ড—সহজেই সাহায্য নিন।</p><a class="btn" href="#support" style="display:block;text-decoration:none;margin-top:14px">💬 Talk to AJBIR AI</a><small class="mut" style="display:block;margin-top:8px">বাংলায় লিখুন অথবা মাইক্রোফোনে কথা বলুন</small></div><h3>সাধারণ প্রশ্ন ও উত্তর</h3><div class="box"><details><summary>কীভাবে অর্ডার করব?</summary><p>পছন্দের পণ্য কার্টে যোগ করুন, ঠিকানা দিন এবং Checkout থেকে অর্ডার নিশ্চিত করুন।</p></details><details><summary>আমার অর্ডার কোথায় দেখব?</summary><p>My Orders অপশনে গিয়ে অর্ডারের বর্তমান স্ট্যাটাস দেখতে পারবেন।</p></details><details><summary>ডেলিভারি কতক্ষণে হবে?</summary><p>সার্ভিসযোগ্য এলাকায় দ্রুত ডেলিভারির চেষ্টা করা হয়। নির্দিষ্ট আপডেট Orders-এ দেখুন।</p></details><details><summary>পেমেন্ট বা রিফান্ডে সমস্যা হলে কী করব?</summary><p>AI সহায়কের সঙ্গে কথা বলুন এবং অর্ডার আইডি উল্লেখ করুন। কখনো OTP বা UPI PIN শেয়ার করবেন না।</p></details><details><summary>ভুল বা ক্ষতিগ্রস্ত পণ্য পেয়েছি—কী করব?</summary><p>AI Support-এ অর্ডার আইডিসহ সমস্যাটি জানান।</p></details></div><div class="box"><h3>আরও সাহায্য দরকার?</h3><p>আমাদের বাংলা AI সহায়ক আপনার প্রশ্ন শুনে সাহায্য করার চেষ্টা করবে।</p><a class="btn" href="#support" style="display:block;text-decoration:none">🎙️ AI-র সঙ্গে কথা বলুন</a></div></section>`},
support(){setTimeout(ajbirLoadChat,0);return `<h2>AJBIR AI কাস্টমার সাপোর্ট</h2><section class="ai-support"><div class="ai-head"><div class="ai-avatar">🎧</div><div><b>AJBIR বাংলা AI সহায়ক</b><div class="ai-status">● সহায়তা প্রস্তুত</div><small>বাংলায় লিখে বা কথা বলে প্রশ্ন করুন</small></div></div><div class="ai-chat" id="aiChat" aria-live="polite"><div class="ai-msg bot">নমস্কার! আমি AJBIR-এর বাংলা কাস্টমার সাপোর্ট সহায়ক। আপনার অর্ডার, ডেলিভারি বা রিফান্ড নিয়ে কী জানতে চান?</div></div><div class="ai-controls"><input id="aiInput" placeholder="আপনার প্রশ্ন লিখুন..." autocomplete="off" onkeydown="if(event.key==='Enter')ajbirAsk()"><button class="btn" onclick="ajbirAsk()" aria-label="Send message">➤</button><button class="ai-mic" id="aiMic" onclick="ajbirVoice()" aria-label="Speak">🎙️</button></div><div class="ai-quick"><button onclick="ajbirQuick('আমার অর্ডার কোথায়?')">📦 অর্ডার কোথায়?</button><button onclick="ajbirQuick('ডেলিভারি কতক্ষণে হবে?')">🛵 ডেলিভারি সময়</button><button onclick="ajbirQuick('রিফান্ড কীভাবে পাব?')">💳 রিফান্ড</button></div><p class="ai-note">ভয়েস ইনপুটের জন্য ব্রাউজারের মাইক্রোফোন অনুমতি লাগবে। এটি প্রাথমিক FAQ-ভিত্তিক সহায়ক; লাইভ জেনারেটিভ AI ও ব্যক্তিগত অর্ডার ডেটার জন্য নিরাপদ সার্ভার সংযোগ প্রয়োজন।</p></section><div class="box"><h3>FAQs</h3><details><summary>How fast is delivery?</summary>Most orders arrive within 30 minutes in covered PIN codes.</details><details><summary>Can I cancel an order?</summary>Yes, before it is out for delivery. Open the order and tap Request cancellation.</details><details><summary>How do refunds work?</summary>Prepaid refunds return to the original payment method in 5–7 working days.</details></div><div class="box"><h3>Raise a request</h3><div class="f"><select id="tk"><option>Order complaint</option><option>Refund request</option><option>Other</option></select><textarea id="tm" placeholder="Describe the issue and add your order ID" autocomplete="off"></textarea></div><button class="btn" onclick="ticket()">Send request</button></div><p>Call/WhatsApp: <b>+91 00000 00000</b> (placeholder) · support@ajbir.in</p>`},

function fetchLiveLocation(){
  if(!navigator.geolocation){ toast('Geolocation is not supported'); return; }
  toast('Fetching your current location...');
  navigator.geolocation.getCurrentPosition(async pos => {
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
      const data = await res.json();
      if(data && data.address){
        const addr = data.address;
        const suburb = addr.suburb || addr.village || addr.town || addr.city_district || 'Local Area';
        const pinCode = addr.postcode || '742101';
        const fullTxt = data.display_name || 'Murshidabad, West Bengal';
        
        S.areaName = suburb;
        S.pin = pinCode;
        S.fullAddr = fullTxt;
        save();
        
        if($('#lbl_area')) $('#lbl_area').textContent = suburb;
        if($('#lbl_full')) $('#lbl_full').textContent = fullTxt + ' (' + pinCode + ')';
        if($('#aa')) $('#aa').value = suburb;
        if($('#ap')) $('#ap').value = pinCode;
        
        toast('Location detected successfully!');
      } else {
        toast('Could not find exact address.');
      }
    } catch(e) {
      toast('Network error while getting location.');
    }
  }, () => {
    toast('Please enable location permission on your phone.');
  }, {enableHighAccuracy: true});
}

async function auth(t){
  const e=$('#e1'),m=$('#mob').value.trim(),p=$('#pw').value;e.textContent='';
  if(!/^[6-9]\d{9}$/.test(m)){e.textContent='Enter a valid 10-digit mobile number.';return}
  if(!p){e.textContent='Enter your password.';return}
  if(t!='in'&&p.length<8){e.textContent='Password must be at least 8 characters.';return}
  if(t=='up'&&p!==$('#pw2').value){e.textContent='Passwords don’t match.';return}
  try{
    const msgBuffer=new TextEncoder().encode(p);
    const hashBuffer=await crypto.subtle.digest('SHA-256',msgBuffer);
    const passHash=Array.from(new Uint8Array(hashBuffer)).map(b=>b.toString(16).padStart(2,'0')).join('');
    if(t=='up'){
      const name=$('#nm').value.trim();
      const {data:exist}=await supabaseClient.from('app_users').select('id').eq('mobile',m).maybeSingle();
      if(exist){e.textContent='Mobile number already registered.';return}
      const now = new Date().toISOString();
      const {data,error}=await supabaseClient.from('app_users').insert([{mobile:m,name:name,password_hash:passHash,first_login_at:now,last_login_at:now,login_count:1}]).select().single();
      if(error)throw error;
      adopt(data);toast('Account created successfully!');goNext();
    }else if(t=='in'){
      const {data:usr,error}=await supabaseClient.from('app_users').select('*').eq('mobile',m).maybeSingle();
      if(error||!usr||usr.password_hash!==passHash){e.textContent='Invalid mobile number or password.';return}
      const now = new Date().toISOString();
      const loginUpdate = {
        first_login_at: usr.first_login_at || now,
        last_login_at: now,
        login_count: (Number(usr.login_count) || 0) + 1
      };
      const {data:updatedUser,error:trackError} = await supabaseClient.from('app_users').update(loginUpdate).eq('id',usr.id).select().single();
      adopt(updatedUser || {...usr,...loginUpdate});
      if(trackError) toast('Logged in, but login history could not be saved. Check Supabase columns/permissions.');
      else toast('Logged in!');
      goNext();
    }
  }catch(x){e.textContent=x.message||'Something went wrong.';}
}

  const ids = Object.keys(S.cart); if(!ids.length){ toast('Your cart is empty'); return; }

  const a = S.addrs[+ai.value]; const pmInput = document.querySelector('[name=pm]:checked');

  const pm = pmInput.value;
  if(pm !== 'cod'){
    alert('AJBIR online payments are not connected yet. UPI/card payments must wait until the secure payment gateway and server verification are configured. Please choose Cash on Delivery for now.');
    return;
  }
  const t = totals(window._cp); const orderId = 'AJB' + Date.now().toString().slice(-8);
  const orderItems = ids.map(i => {
    const item = P.find(x=>x.id==i);
    return {id: i, n: item ? item.n : 'Product', p: item ? item.p : 0, q: S.cart[i]};
  });
  const orderData = {id: orderId, user_id: S.user.id, total: t.total, status: 'Processing', payment_method: pm, is_paid: false, delivery_slot: $('#slot').value, address: a, items: orderItems};
  try {

  box.innerHTML=`<div class="row" style="gap:8px;margin-bottom:10px"><b class="sp">💰 Profit Management</b><button class="btn sm" onclick="pfLoad()">Refresh</button><button class="btn sm" onclick="pfOut()">Sign out</button></div>

  <div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:10px">${cd('Today net profit',D.net,1)}${cd('This month net profit',M.net,1)}</div>
  <p class="mut" style="font-size:12px">Revenue = order total − refund. Cancelled orders count as ₹0 revenue. Expenses = supplier cost + delivery + payment fee + other.</p>
  <div class="box"><h3>Default costs for new orders</h3><div class="row" style="gap:8px"><div class="f" style="flex:1"><label>Delivery cost / order (₹)</label><input type="number" value="${pfG('pf_dc',20)}" onchange="pfSet('pf_dc',this.value)"></div><div class="f" style="flex:1"><label>Online payment fee (%)</label><input type="number" step="0.1" value="${pfG('pf_fp',2)}" onchange="pfSet('pf_fp',this.value)"></div></div></div>
  <div class="box"><h3>Products: selling vs supplier price</h3>${miss?`<p class="err">⚠️ ${miss} products have no supplier price yet. Orders with them wait until you set it.</p>`:''}<div class="tw"><table><thead><tr><th>Product</th><th>Selling ₹</th><th>Supplier ₹</th><th>Profit/unit</th></tr></thead><tbody>${P.map(p=>{const s=PF.costs[p.id],g=s==null?null:p.p-s;return `<tr><td><b>${p.n}</b><br><small class="mut">${p.u||''}</small></td><td><input type="number" step="0.01" value="${p.p}" style="width:68px;padding:4px" onchange="pfPrice(${p.id},this.value)"></td><td><input type="number" step="0.01" value="${s==null?'':s}" placeholder="?" style="width:68px;padding:4px" onchange="pfCost(${p.id},this.value)"></td><td style="${g==null?'':col(g)}">${g==null?'—':pfR(g)+' ('+Math.round(g/p.p*100)+'%)'}</td></tr>`}).join('')}</tbody></table></div></div>
  <div class="box"><h3>Profit per order</h3><div class="tw"><table><thead><tr><th>Order</th><th>Status</th><th>Revenue</th><th>Supplier cost</th><th>Delivery</th><th>Pay fee</th><th>Other</th><th>Refund</th><th>Net</th></tr></thead><tbody>${rows.slice(0,60).map(({o,c})=>{const f=PF.fin[o.id]||{},i=k=>`<input type="number" step="0.01" value="${n(f[k])}" style="width:60px;padding:4px" onchange="pfFin('${o.id}','${k}',this.value)">`;return `<tr><td><b>${o.id}</b><br><small class="mut">${new Date(o.created_at).toLocaleDateString('en-IN')}</small></td><td>${o.status}</td><td>${pfR(c.rev)}</td><td>${i('cogs')}${PF.fin[o.id]?'':' ⚠️'}</td><td>${i('delivery_cost')}</td><td>${i('payment_fee')}</td><td>${i('other_expense')}</td><td>${i('refund')}</td><td style="${col(c.net)}"><b>${pfR(c.net)}</b></td></tr>`}).join('')||'<tr><td colspan="9" class="mut">No orders yet</td></tr>'}</tbody></table></div></div>
  <div class="box"><h3>Daily profit</h3>${gt(grp(10).slice(0,31),'Date')}</div><div class="box"><h3>Monthly profit</h3>${gt(grp(7),'Month')}</div>`;
}
/* customers: pick up admin-set selling prices (public table, no costs inside) */
try{supabaseClient.from('product_prices').select('product_id,price').then(r=>{const d=r&&r.data;if(!d||!d.length)return;let ch=0;d.forEach(x=>{const p=P.find(q=>q.id==x.product_id);if(p&&p.p!=+x.price){p.p=+x.price;ch=1}});if(ch&&(!location.hash||location.hash=='#home'))route()}).catch(()=>{})}catch(e){}
</script>
<script>
/* AJBIR Video Ads: admin upload/manage + customer swipe section (data in Supabase, admin via Supabase Auth + RLS) */
const VD={list:null};
const vdE=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const vdLink=l=>/^(https?:\/\/|#)/i.test(l||'')?l:'';
document.head.insertAdjacentHTML('beforeend','<style>#vd-sec{margin:8px 0 20px}.vd-h{margin:18px 4px 8px}.vd-row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px;-webkit-overflow-scrolling:touch}.vd-card{flex:0 0 78%;max-width:340px;scroll-snap-align:center;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--bg);animation:vdIn .6s ease both}.vd-card video{width:100%;aspect-ratio:9/16;max-height:62vh;background:#000;display:block;object-fit:contain}.vd-t{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px}@keyframes vdIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@media(min-width:700px){.vd-card{flex-basis:300px}}</style>');
document.addEventListener('play',e=>{if(e.target.tagName=='VIDEO')document.querySelectorAll('#vd-sec video').forEach(v=>{if(v!==e.target)v.pause()})},true);
async function vdFetch(){try{const r=await supabaseClient.from('video_ads').select('id,title,link,video_url').eq('visible',true).order('sort',{ascending:true}).order('created_at',{ascending:false});VD.list=r.data||[]}catch(e){VD.list=[]}vdFill()}
function vdFill(){const el=document.getElementById('vd-sec');if(!el||!VD.list)return;if(!VD.list.length){el.style.display='none';return}
  el.style.display='block';el.innerHTML=`<h2 class="vd-h">🎬 AJBIR Offers</h2><div class="vd-row">${VD.list.map(v=>{const l=vdLink(v.link);return `<div class="vd-card"><video src="${vdE(v.video_url)}" controls playsinline preload="metadata"></video><div class="vd-t"><b>${vdE(v.title)}</b>${l?`<a class="btn sm" href="${vdE(l)}"${l[0]=='#'?'':' target="_blank" rel="noopener"'}>View offer</a>`:''}</div></div>`}).join('')}</div>`}
if(typeof V.home==='function'){const _vh=V.home;V.home=function(){setTimeout(()=>{VD.list?vdFill():vdFetch()},60);return _vh.apply(this,arguments)+'<section id="vd-sec" style="display:none"></section>'}}
V.adminTabs.videos=function(){setTimeout(vdLoad,80);return '<div id="vd-box"><p class="mut">Loading…</p></div>'};
async function vdSign(){const em=adminLoginEmail($('#vd_e').value);if(!em)return;const{error}=await pfClient().auth.signInWithPassword({email:em,password:$('#vd_p').value});if(error){toast(error.message);return}vdLoad()}
async function vdLoad(){const box=document.getElementById('vd-box');if(!box)return;
  try{const db=pfClient(),{data:{session}}=await db.auth.getSession();
    if(!session){box.innerHTML=`<div class="box"><h3>🔐 Admin login</h3><div class="f"><label>Phone number</label><input id="vd_e" type="tel" inputmode="numeric" maxlength="14" placeholder="10-digit phone number" autocomplete="username"></div><div class="f"><label>Password</label><input id="vd_p" type="password" autocomplete="current-password"></div><button class="btn" onclick="vdSign()">Sign in</button></div>`;return}
    const r=await db.from('video_ads').select('*').order('sort',{ascending:true}).order('created_at',{ascending:false});
    if(r.error){box.innerHTML='<p class="err">'+vdE(r.error.message)+' — run video_ads_setup.sql first.</p>';return}
    box.innerHTML=`<div class="box"><h3>＋ Upload video ad</h3><div class="f"><label>Title</label><input id="vd_t" maxlength="80"></div><div class="f"><label>Product / offer link (optional)</label><input id="vd_l" placeholder="https://… or #home"></div><div class="f"><label>Video (MP4/WebM, max 50 MB)</label><input id="vd_f" type="file" accept="video/mp4,video/webm,video/quicktime"></div><button class="btn" id="vd_b" onclick="vdUp()">+ Upload Video</button></div>${(r.data||[]).map(v=>`<div class="box"><video src="${vdE(v.video_url)}" controls playsinline preload="metadata" style="width:100%;max-height:260px;background:#000;border-radius:10px"></video><p><b>${vdE(v.title)}</b> ${v.visible?'🟢 Visible':'⚪ Hidden'}<br><small class="mut">${vdE(v.link||'no link')}</small></p><div class="row" style="gap:8px"><button class="btn sm" onclick="vdTog('${v.id}',${!v.visible})">${v.visible?'Hide':'Show'}</button><button class="btn sm" onclick="vdDel('${v.id}')">Delete</button></div></div>`).join('')||'<p class="mut">No videos yet.</p>'}<button class="btn sm" onclick="pfOut().then(vdLoad)">Sign out</button>`;
  }catch(e){box.innerHTML='<p class="err">'+vdE(e.message)+'</p>'}}
async function vdUp(){const f=$('#vd_f').files[0],t=$('#vd_t').value.trim();if(!f||!t){toast('Add a title and choose a video');return}if(f.size>52428800){toast('Video must be under 50 MB');return}
  const b=$('#vd_b'),rs0=()=>{b.disabled=false;b.textContent='+ Upload Video'};b.disabled=true;b.textContent='Uploading…';
  const db=pfClient(),ext=(f.name.split('.').pop()||'mp4').toLowerCase().replace(/[^a-z0-9]/g,''),path=Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
  const u=await db.storage.from('ajbir-video-ads').upload(path,f,{contentType:f.type,cacheControl:'3600'});
  if(u.error){toast(u.error.message);rs0();return}
  const url=db.storage.from('ajbir-video-ads').getPublicUrl(path).data.publicUrl,l=$('#vd_l').value.trim();
  const i=await db.from('video_ads').insert({title:t,link:l||null,video_url:url,storage_path:path});
  if(i.error){await db.storage.from('ajbir-video-ads').remove([path]);toast(i.error.message);rs0();return}
  VD.list=null;toast('Video uploaded');vdLoad()}
async function vdTog(id,v){const{error}=await pfClient().from('video_ads').update({visible:v}).eq('id',id);if(error)toast(error.message);VD.list=null;vdLoad()}
async function vdDel(id){if(!confirm('Delete this video?'))return;const db=pfClient(),r=await db.from('video_ads').select('storage_path').eq('id',id).single();
  if(r.data&&r.data.storage_path)await db.storage.from('ajbir-video-ads').remove([r.data.storage_path]);
  const{error}=await db.from('video_ads').delete().eq('id',id);if(error)toast(error.message);VD.list=null;vdLoad()}
</script>
<script>
/* AJBIR Admin Branding: logo/icon is stored centrally in Supabase and applied to all visitors. */
const BRAND={url:null};
function brandApply(url){
  if(!url)return;
  BRAND.url=url;
  document.querySelectorAll('#ajbir-splash .splash-logo, header .brand img, a.brand img, img[alt="AJBIR logo"]').forEach(el=>el.src=url);
  ['icon','shortcut icon','apple-touch-icon'].forEach(rel=>{
    let el=document.querySelector('link[rel="'+rel+'"]');
    if(!el){el=document.createElement('link');el.rel=rel;document.head.appendChild(el)}
    el.href=url;
  });
}
async function brandFetch(){
  try{const {data,error}=await supabaseClient.from('site_settings').select('value').eq('key','branding').maybeSingle();
    if(!error&&data&&data.value&&data.value.logo_url)brandApply(data.value.logo_url);
  }catch(e){console.warn('Brand settings unavailable',e)}
}
V.adminTabs.branding=function(){setTimeout(brandLoad,80);return '<div id="brand-box"><p class="mut">Loading branding settings…</p></div>'};
async function brandLoad(){
  const box=document.getElementById('brand-box');if(!box)return;
  try{
    const db=pfClient(),{data:{session}}=await db.auth.getSession();
    if(!session){box.innerHTML='<div class="box"><h3>🔐 Admin login</h3><p class="mut">Sign in with the owner account to change the app logo.</p><div class="f"><label>Owner phone number</label><input id="br_e" type="tel" inputmode="numeric" maxlength="14" placeholder="10-digit phone number"></div><div class="f"><label>Password</label><input id="br_p" type="password" autocomplete="current-password"></div><button class="btn" onclick="brandSign()">Sign in</button></div>';return}
    const {data,error}=await db.from('site_settings').select('value').eq('key','branding').maybeSingle();
    if(error){box.innerHTML='<p class="err">'+vdE(error.message)+' — run ajbir_admin_setup.sql in Supabase first.</p>';return}
    const url=data&&data.value&&data.value.logo_url?data.value.logo_url:'';
    box.innerHTML=`<div class="box"><h3>🎨 App Logo & Apple Icon</h3><p class="mut">এখানে লোগো বদলালে ওয়েবসাইটের Header, Opening Screen, Browser Favicon এবং Apple Touch Icon আপডেট হবে।</p>${url?`<img src="${vdE(url)}" alt="Current app logo" style="width:112px;height:112px;object-fit:contain;border:1px solid var(--line);border-radius:16px;padding:8px;background:#fff">`:'<p class="mut">No custom logo uploaded yet.</p>'}<div class="f"><label>নতুন Logo / App Icon (PNG, JPG, WEBP; square image recommended)</label><input id="br_file" type="file" accept="image/png,image/jpeg,image/webp"></div><button class="btn" id="br_save" onclick="brandSave()">Upload & Apply Logo</button><p class="mut" style="font-size:12px">Apple Home Screen icon cache করতে পারে। পরিবর্তনের পর iPhone/iPad-এ পুরোনো shortcut সরিয়ে নতুন করে Add to Home Screen করতে হতে পারে।</p></div><button class="btn sm" onclick="pfOut().then(brandLoad)">Sign out</button>`;
  }catch(e){box.innerHTML='<p class="err">'+vdE(e.message)+'</p>'}
}
async function brandSign(){const em=adminLoginEmail(document.getElementById('br_e').value);if(!em)return;const{error}=await pfClient().auth.signInWithPassword({email:em,password:document.getElementById('br_p').value});if(error){toast(error.message);return}brandLoad()}
async function brandSave(){
  const input=document.getElementById('br_file'),file=input&&input.files[0];if(!file){toast('Choose a logo image first');return}
  if(!['image/png','image/jpeg','image/webp'].includes(file.type)){toast('Use PNG, JPG or WEBP');return}
  if(file.size>5*1024*1024){toast('Logo must be under 5 MB');return}
  const btn=document.getElementById('br_save');btn.disabled=true;btn.textContent='Uploading…';
  try{
    const db=pfClient(),ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg',path='app-logo-'+Date.now()+'.'+ext;
    const up=await db.storage.from('ajbir-branding').upload(path,file,{contentType:file.type,upsert:true,cacheControl:'3600'});
    if(up.error)throw up.error;
    const url=db.storage.from('ajbir-branding').getPublicUrl(path).data.publicUrl;
    const saved=await db.from('site_settings').upsert({key:'branding',value:{logo_url:url,updated_at:new Date().toISOString()}},{onConflict:'key'});
    if(saved.error)throw saved.error;
    brandApply(url);toast('App logo updated for all visitors');brandLoad();
  }catch(e){toast(e.message||'Logo upload failed');btn.disabled=false;btn.textContent='Upload & Apply Logo'}
}
brandFetch();
</script>
<script>
/* AJBIR motion layer: page-change animation, ripple, cart bump */
(function(){
  var app=document.getElementById('app'); if(!app) return;
  var tm;
  function play(){app.classList.remove('pg-anim');void app.offsetWidth;app.classList.add('pg-anim');clearTimeout(tm);tm=setTimeout(function(){app.classList.remove('pg-anim')},1500)}
  setTimeout(play,1900);                       // first load: after splash
  addEventListener('hashchange',play);          // every page change
  document.addEventListener('pointerdown',function(e){
    var b=e.target.closest&&e.target.closest('.btn,.pill,.chip,.cat,.dept,.ai-mic,.ai-quick button,.admin-tab-btn');
    if(!b||b.disabled) return;
    var r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement('span');
    s.className='m-rip';s.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(e.clientX-r.left-d/2)+'px;top:'+(e.clientY-r.top-d/2)+'px';
    b.appendChild(s);setTimeout(function(){s.remove()},650);
  },{passive:true});
  var cb=document.getElementById('cartb');
  if(cb){var last=cb.textContent;new MutationObserver(function(){var t=cb.textContent;if(t!==last){last=t;cb.classList.remove('bump');void cb.offsetWidth;cb.classList.add('bump')}}).observe(cb,{childList:true,characterData:true,subtree:true})}
})();
</script>
<script>
/* AJBIR app layer: service worker + install prompt */
if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
(function(){
  if(matchMedia('(display-mode: standalone)').matches||navigator.standalone) return;
  try{if(localStorage.getItem('ajbir-install-no')) return}catch(e){}
  var ev=null,bar=null;
  function show(msg,act){
    if(bar) return;
    bar=document.createElement('div');
    bar.style.cssText='position:fixed;left:8px;right:8px;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:25;background:#000;color:#fff;border:2px solid #FFC60A;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:8px;font-size:14px;line-height:1.3';
    var t=document.createElement('span');t.style.flex='1';t.textContent=msg;bar.appendChild(t);
    if(act){var b=document.createElement('button');b.textContent='Install';b.style.cssText='background:#FFC60A;color:#000;border:0;border-radius:99px;padding:6px 14px;font-weight:700;cursor:pointer';b.onclick=act;bar.appendChild(b)}
    var x=document.createElement('button');x.textContent='\u2715';x.setAttribute('aria-label','Close');x.style.cssText='background:none;border:0;color:#fff;font-size:18px;cursor:pointer';
    x.onclick=function(){bar.remove();bar=null;try{localStorage.setItem('ajbir-install-no','1')}catch(e){}};bar.appendChild(x);
    document.body.appendChild(bar);
  }
  addEventListener('beforeinstallprompt',function(e){e.preventDefault();ev=e;show('AJBIR \u0985\u09cd\u09af\u09be\u09aa \u0987\u09a8\u09b8\u09cd\u099f\u09b2 \u0995\u09b0\u09c1\u09a8',function(){ev.prompt();ev.userChoice.then(function(){if(bar){bar.remove();bar=null}ev=null})})});
  addEventListener('appinstalled',function(){if(bar){bar.remove();bar=null}});
  if(/iphone|ipad|ipod/i.test(navigator.userAgent)){setTimeout(function(){show('Safari: Share \u2192 Add to Home Screen')},5000)}
})();
</script>
